schema: spec-driven

context: |
  Produto: QA Manager, uma aplicação local e gratuita de gestão de testes para uso pessoal.
  Objetivo: atender testes manuais de qualquer tipo de software, com inspiração em Qase,
  TestRail, Testmo, Zephyr Scale e PractiTest, sem carregar complexidade corporativa.
  Fluxo central: definir casos reutilizáveis, planejar escopo, executar snapshots,
  registrar resultados e acompanhar qualidade e defeitos.
  Stack: React 19 com Vite no frontend, Node.js/Express no backend e SQLite/Prisma.
  Restrições: sem autenticação, sem nuvem e sem multiusuário nesta fase.
  Convenções: JavaScript, API REST JSON, validação com Zod, chamadas HTTP centralizadas
  em frontend/src/services/api.js e interface densa voltada à produtividade.
  Documentos existentes: PRODUCT.md, ARCHITECTURE.md, API.md, DESIGN.md, RULES.md,
  TASKS.md, IMPLEMENTATION.md e BENCHMARK.md.

rules:
  proposal:
    - Mantenha o escopo adequado para uma entrega incremental.
    - Declare explicitamente o que não faz parte da mudança.
  specs:
    - Escreva requisitos observáveis e independentes da implementação.
    - Inclua cenários de sucesso, vazio, validação e preservação de histórico quando aplicável.
  design:
    - Registre decisões de modelo de dados e compatibilidade com a base local existente.
    - Favoreça simplicidade operacional e evolução por migrations.
  tasks:
    - Organize tarefas em fatias verificáveis de backend, frontend e validação.
    - Cada etapa funcional deve terminar com um critério de verificação.
